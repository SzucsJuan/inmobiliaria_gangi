<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Encuentra las mejores propiedades en venta y alquiler. Ofrecemos todo tipo de propiedades en diversas ubicaciones, con opciones para todos los presupuestos.">
  <link rel="icon" type="image/png" href="/assets/icons/logo1.png">
  <link rel="stylesheet" href="/assets/style/style.css">
  <link rel="stylesheet" href="/assets/style/home.css">
  <script src="/js/config.js"></script>
  <script src="/js/app.js"></script>
  <title>Inmobiliaria Gangi - Inicio</title>
</head>

<body>
  <!-- Encabezado -->
  <script src="/js/navbar.js"></script>
  <!-- Sección principal -->
  <div class="home-content">
    <section class="hero">
      <div class="overlay"></div>
      <div class="hero-content">
        <h1>Encontrá tu propiedad ideal</h1>
        <p>Selecciona la ubicacion y tipo de vivienda de preferencia, nosotros nos encargamos de brindarte opciones según tus elecciones.</p>
        <div class="search-bar">
          <div class="search-box">
            <select id="location-select">
              <option value="" selected class="placeholder-option">Seleccionar ubicación</option>
              <option value="Avellaneda">Avellaneda</option>
              <option value="Barracas">Barracas</option>
              <option value="Don Bosco Este">Don Bosco Este</option>
              <option value="Ezpeleta Este">Ezpeleta Este</option>
              <option value="Mar del Plata">Mar del Plata</option>
              <option value="Miramar">Miramar</option>
              <option value="La Plata">La Plata</option>
              <option value="La Lucila del Mar">La Lucila del Mar</option>
              <option value="Lanus Este">Lanus Este</option>
              <option value="Lomas de Zamora Este">Lomas de Zamora Este</option>
              <option value="Villa Dominico">Villa Dominico</option>
              <option value="Quilmes Centro">Quilmes Centro</option>
              <option value="Quilmes Oeste">Quilmes Oeste</option>
              <option value="Quilmes Sur">Quilmes Sur</option>
              <option value="San Vicente">San Vicente</option>
              <option value="Santa Teresita">Santa Teresita</option>
              <option value="Sarandi">Sarandi</option>
              <option value="Tigre">Tigre</option>
              <option value="Wilde Centro">Wilde Centro</option>
              <option value="Wilde">Wilde</option>
            </select>
          </div>
  
          <div class="search-box">
            <select id="type-select">
              <option value="" selected class="placeholder-option">Tipo de vivienda</option>
              <option value="Departamento">Departamentos</option>
              <option value="local">Locales</option>
              <option value="casa">Casas</option>
              <option value="lote">Lotes</option>
              <option value="galpon">Galpones</option>
              <option value="oficina">Oficinas</option>
            </select>
          </div>
  
          <button id="search-button">🔍 Buscar</button>
        </div>
      </div>
      <script>
        document.getElementById("search-button").addEventListener("click", function () {
    const location = document.getElementById("location-select").value;
    const type = document.getElementById("type-select").value;

    if (!location && !type) {
        alert("Por favor, selecciona una ubicación o un tipo de vivienda.");
        return;
    }

    const params = new URLSearchParams();
    if (location) params.set("location", location);
    if (type) params.set("tipo", type);

    window.location.href = `property-list.html?${params.toString()}`;
});

      </script>
    </section>
  </div>

  <section class="featured-properties">
    <h2>Propiedades destacadas</h2>
    <p>Una seleccion de nuestras propiedades destacadas que pueden llegar a interesarte.</p>
  </section>

  <section class="properties-section">
    <div class="button-view-all">
      <a href="/property-list.html" class="view-all-btn">Ver todo</a>
    </div>
    <div class="main-properties">
      <div class="card-container">
      </div>
    </div>
  </section>

  <!-- Pie de página -->
  <script src="/js/footer.js"></script>
  
  <!-- Scripts -->
  <script src="/js/hamburger-nav.js"></script>
  <script src="/js/home.js"></script>
</body>

</html>
